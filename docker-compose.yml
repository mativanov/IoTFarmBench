services:
  postgres:
    image: postgres:16-alpine
    container_name: iotfarmbench-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-iotfarmbench}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-iotfarmbench}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: iotfarmbench-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  rest-service:
    build:
      context: ./services/rest-service
      dockerfile: Dockerfile
    container_name: iotfarmbench-rest
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-iotfarmbench}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_POOL_MAX: ${DB_POOL_MAX:-30}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  grpc-service:
    build:
      context: ./services/grpc-service
      dockerfile: Dockerfile
    container_name: iotfarmbench-grpc
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-iotfarmbench}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_POOL_MAX: ${DB_POOL_MAX:-30}
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy

  graphql-service:
    build:
      context: ./services/graphql-service
      dockerfile: Dockerfile
    container_name: iotfarmbench-graphql
    environment:
      NODE_ENV: development
      PORT: 5002
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-iotfarmbench}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_POOL_MAX: ${DB_POOL_MAX:-30}
    ports:
      - "5002:5002"
    depends_on:
      postgres:
        condition: service_healthy

  importer:
    build:
      context: ./importer
      dockerfile: Dockerfile
    container_name: iotfarmbench-importer
    profiles:
      - tools
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-iotfarmbench}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
